<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UCO CRM Operations</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <h1 data-i18n="app.title">UCO CRM</h1>
          <p data-i18n="app.subtitle">Headless retail loyalty platform scaffold</p>
        </div>
        <div class="topbar-actions">
          <label class="select-label" for="locale" data-i18n="label.language">Language</label>
          <select id="locale" aria-label="Language" data-i18n-title="label.language">
            <option value="kk">KZ</option>
            <option value="ru">RU</option>
            <option value="en">EN</option>
          </select>
          <span id="health" class="status" data-i18n="status.checking">Checking</span>
          <button id="refresh" class="icon-button" type="button" data-i18n-title="action.refresh" title="Refresh" aria-label="Refresh">↻</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="sidebar" aria-label="Sections" data-i18n-title="aria.sections">
          <nav class="tabs" aria-label="Dashboard sections" data-i18n-title="aria.dashboardSections">
            <button class="tab active" type="button" data-section="overview" data-i18n="nav.overview">Overview</button>
            <button class="tab" type="button" data-section="customer" data-i18n="nav.customer360">Customer 360</button>
            <button class="tab" type="button" data-section="pos" data-i18n="nav.posLoyalty">POS/Loyalty</button>
            <button class="tab" type="button" data-section="promotions" data-i18n="nav.promotions">Promotions</button>
          </nav>
          <div id="modulesCompact" class="modules-compact" aria-live="polite"></div>
        </aside>

        <section class="content" aria-live="polite">
          <section id="overviewPanel" class="panel active" data-panel="overview"></section>
          <section id="customerPanel" class="panel" data-panel="customer"></section>
          <section id="posPanel" class="panel" data-panel="pos"></section>
          <section id="promotionsPanel" class="panel" data-panel="promotions"></section>
        </section>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
